name: Release
run-name: ${{ inputs.request_id || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: vX.Y.Z or vX.Y.Z-dev.YYYYMMDD.HHMMSSZ
        required: true
        type: string
      source_sha:
        description: Optional immutable synchronized source commit
        type: string
        default: ""
      request_id:
        description: Optional caller correlation ID
        type: string
        default: ""
      dry_run:
        description: Validate, test and build without creating tags or publishing
        type: boolean
        default: true
      prerelease:
        description: Mark the GitHub release as a prerelease; dev versions always are
        type: boolean
        default: false
      publish_maven_central:
        description: Publish to Maven Central
        type: boolean
        default: true
      maven_central_auto_publish:
        description: Automatically publish the validated Maven Central deployment
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  RELEASE_VERSION: ${{ inputs.version }}
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
  MARK_PRERELEASE: ${{ inputs.prerelease }}
  VERTESIA_LIVE_TESTS: "0"

jobs:
  release:
    name: Release SDK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    permissions:
      contents: write # Create or verify the immutable source tag and GitHub release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test release contract
        run: python3 -m unittest discover -s scripts -p test_release_cohort.py
      - name: Validate synchronized source
        run: python3 scripts/release_cohort.py validate --lang java
      - name: Apply generation patches
        run: scripts/post_generate.sh
      - name: Stamp artifact version in the build workspace
        run: python3 scripts/release_cohort.py stamp --lang java
      - name: Test and package SDK
        run: mvn -B verify
      - name: Check prior publication
        id: registry
        if: inputs.dry_run == false && inputs.publish_maven_central
        run: python3 scripts/release_cohort.py registry --lang java
      - name: Validate Maven Central credentials
        if: inputs.dry_run == false && inputs.publish_maven_central && steps.registry.outputs.published != 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          for key in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD MAVEN_GPG_PRIVATE_KEY MAVEN_GPG_PASSPHRASE; do
            if [[ -z "${!key}" ]]; then echo "Missing $key" >&2; exit 1; fi
          done
      - name: Configure Maven Central credentials
        if: inputs.dry_run == false && inputs.publish_maven_central && steps.registry.outputs.published != 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Create immutable source tag
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_cohort.py tag --lang java
      - name: Publish Maven Central deployment
        if: inputs.dry_run == false && inputs.publish_maven_central && steps.registry.outputs.published != 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          AUTO_PUBLISH: ${{ inputs.maven_central_auto_publish }}
        run: |
          wait_until=validated
          if [[ "$AUTO_PUBLISH" == "true" ]]; then wait_until=published; fi
          # Older pinned SDK sources also need the Maven 3.10 staging metadata fix.
          publisher_version="$(python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          version = ET.parse("pom.xml").findtext("./{*}properties/{*}central-publishing-maven-plugin.version")
          parts = tuple(int(part) for part in version.split("-")[0].split("."))
          print("0.12.0" if parts < (0, 12, 0) else version)
          PYTHON
          )"
          mvn -B -Pcentral,signed deploy \
            -Dcentral-publishing-maven-plugin.version="$publisher_version" \
            -Dcentral.autoPublish="$AUTO_PUBLISH" -Dcentral.waitUntil="$wait_until"
      - name: Create or resume GitHub release
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The source tag was created/verified before publishing. Fetch and recheck it on retries.
          git fetch origin "refs/tags/${RELEASE_VERSION}:refs/tags/${RELEASE_VERSION}"
          [[ "$(git rev-parse "${RELEASE_VERSION}^{commit}")" == "$SOURCE_SHA" ]]
          release_args=(--verify-tag --title "$RELEASE_VERSION" --generate-notes)
          if [[ "$RELEASE_VERSION" == *-dev.* || "$MARK_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          if ! gh release view "$RELEASE_VERSION" >/dev/null; then
            gh release create "$RELEASE_VERSION" "${release_args[@]}"
          fi
