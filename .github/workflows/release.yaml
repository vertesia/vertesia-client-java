name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v1.2.3
        required: true
        type: string
      development_version:
        description: Next development version, for example 1.2.4-SNAPSHOT
        required: true
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: false
        type: boolean
        default: false
      publish_maven_central:
        description: Upload release artifacts to Maven Central Portal
        required: false
        type: boolean
        default: true
      maven_central_auto_publish:
        description: Automatically publish the validated Maven Central deployment
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # Push release commits/tags and create the GitHub Release.
    env:
      VERTESIA_LIVE_TESTS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version
        id: version
        env:
          INPUT_DEVELOPMENT_VERSION: ${{ inputs.development_version }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          version="$INPUT_VERSION"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be semver with a leading v, for example v1.2.3" >&2
            exit 1
          fi
          development_version="$INPUT_DEVELOPMENT_VERSION"
          if [[ ! "$development_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?-SNAPSHOT$ ]]; then
            echo "development_version must be semver ending in -SNAPSHOT, for example 1.2.4-SNAPSHOT" >&2
            exit 1
          fi
          if git rev-parse "$version" >/dev/null 2>&1; then
            echo "Tag $version already exists" >&2
            exit 1
          fi
          package_version="${version#v}"
          spec_version="$(python3 -c 'import json; print(json.load(open("spec/vertesia-openapi.json"))["info"]["version"])')"
          if [[ "$spec_version" != "$package_version" ]]; then
            echo "OpenAPI spec info.version is $spec_version, want $package_version" >&2
            exit 1
          fi
          configured_version="$(awk -F': ' '/artifactVersion:/ {print $2}' openapi-generator-config.yaml | tr -d '\"')"
          if [[ "$configured_version" != "$package_version" ]]; then
            echo "openapi-generator-config.yaml artifactVersion is $configured_version, want $package_version" >&2
            exit 1
          fi
          pom_version="$(python3 -c 'import xml.etree.ElementTree as ET; root=ET.parse("pom.xml").getroot(); ns={"m":"http://maven.apache.org/POM/4.0.0"}; print(root.find("m:version", ns).text)')"
          expected_pom_version="${package_version}-SNAPSHOT"
          if [[ "$pom_version" != "$expected_pom_version" ]]; then
            echo "pom.xml version is $pom_version, want $expected_pom_version" >&2
            exit 1
          fi
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Prepare Maven release
        env:
          DEVELOPMENT_VERSION: ${{ inputs.development_version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.package_version }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          mvn -B release:prepare \
            -DreleaseVersion="$RELEASE_VERSION" \
            -DdevelopmentVersion="$DEVELOPMENT_VERSION" \
            -Dtag="$RELEASE_TAG" \
            -DpreparationGoals=validate

      - name: Validate Maven Central secrets
        if: ${{ inputs.publish_maven_central }}
        env:
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        shell: bash
        run: |
          missing=()
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD MAVEN_GPG_PRIVATE_KEY MAVEN_GPG_PASSPHRASE; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required Maven Central secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Configure Maven Central credentials
        if: ${{ inputs.publish_maven_central }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
        env:
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Publish Maven Central deployment
        if: ${{ inputs.publish_maven_central }}
        env:
          MAVEN_CENTRAL_AUTO_PUBLISH: ${{ inputs.maven_central_auto_publish }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        shell: bash
        run: |
          central_wait_until="validated"
          if [[ "$MAVEN_CENTRAL_AUTO_PUBLISH" == "true" ]]; then
            central_wait_until="published"
          fi

          mvn -B release:perform \
            -Darguments="-Pcentral,signed -Dcentral.autoPublish=$MAVEN_CENTRAL_AUTO_PUBLISH -Dcentral.waitUntil=$central_wait_until"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          prerelease_args=()
          if [[ "$PRERELEASE" == "true" ]]; then
            prerelease_args=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            "${prerelease_args[@]}"
