name: Test

on:
  push:
    branches: [main, "release/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      VERTESIA_LIVE_TESTS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # The patch scripts run on raw generator output in the sync job, not on these formatted sources.
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

      # Exercise patch changes before the next generated client refresh.
      - run: python3 scripts/patch_forward_compat_validation.py

      - name: Run Maven verification
        run: mvn -B verify

      - name: Test release contract
        run: python3 -m unittest discover -s scripts -p test_release_cohort.py

      - name: Verify Maven Central bundle without uploading
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import runpy
          import xml.etree.ElementTree as ET
          version = ET.parse("pom.xml").findtext("./{*}version").removesuffix("-SNAPSHOT") + "-ci"
          runpy.run_path("scripts/release_cohort.py")["stamp"](version, "java")
          Path("target/central-ci-version").write_text(version)
          PYTHON
          mvn -B -Pcentral deploy -DskipUpload=true
          python3 - <<'PYTHON'
          from pathlib import Path
          from zipfile import ZipFile
          version = Path("target/central-ci-version").read_text()
          prefix = "io/vertesia/vertesia-client/" + version + "/"
          with ZipFile("target/central-publishing/central-bundle.zip") as archive:
              files = [name for name in archive.namelist() if not name.endswith("/")]
          assert files and all(name.startswith(prefix) for name in files), files
          for suffix in (".pom", ".jar", "-sources.jar", "-javadoc.jar"):
              assert prefix + "vertesia-client-" + version + suffix in files, suffix
          print("Central bundle contains all required artifacts without staging metadata")
          PYTHON
