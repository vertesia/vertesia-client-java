name: Generated Code Guard

on:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject generated OpenAPI changes in PRs
        shell: bash
        run: |
          changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"

          generated_changes="$(echo "$changed_files" | grep -E '^(src/main/java/io/vertesia/(api|auth|model)/|src/main/java/io/vertesia/(ApiCallback|ApiClient|ApiException|ApiResponse|Configuration|GzipRequestInterceptor|JSON|Pair|ProgressRequestBody|ProgressResponseBody|ServerConfiguration|ServerVariable|StringUtil)\.java|spec/|\.openapi-generator/)' || true)"
          if [[ -n "$generated_changes" ]]; then
            echo "Generated OpenAPI files are updated only by internal generation automation." >&2
            echo "Move hand-written SDK changes outside generated paths, or let the sync automation regenerate them." >&2
            echo "" >&2
            echo "Generated files changed:" >&2
            echo "$generated_changes" >&2
            exit 1
          fi
